name: Build

on:
  push:
    branches: [ master, 'debug/**' ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  PROJECT_TYPE: KEXT

jobs:
  build:
    name: Build
    # Sequoia (macOS 15) runner: the build uses the macOS 15 SDK from Xcode 16.x,
    # matching the target OS instead of the newest available toolchain.
    runs-on: macos-15
    env:
      JOB_TYPE: BUILD
    steps:
      - name: Checkout WhateverGreen
        uses: actions/checkout@v4

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Select Sequoia Xcode
        # ocbuild's ci-bootstrap.sh pins Xcode 26.6.0, which does not exist on the
        # macOS 15 image, so pick the newest Xcode 16.x (macOS 15 SDK) locally.
        run: |
          xcode_app="$(/bin/ls -d /Applications/Xcode_16*.app 2>/dev/null | /usr/bin/sort -V | /usr/bin/tail -1)"
          if [ -z "${xcode_app}" ]; then
            xcode_app="/Applications/$(xcrun --find xcodebuild | /usr/bin/cut -d/ -f3)"
          fi
          echo "Using ${xcode_app}"
          echo "DEVELOPER_DIR=${xcode_app}/Contents/Developer" >> "${GITHUB_ENV}"
          export DEVELOPER_DIR="${xcode_app}/Contents/Developer"
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK version: ${sdk_version}"
          case "${sdk_version}" in
            15.*) ;;
            *) echo "ERROR: expected the macOS 15 (Sequoia) SDK, got ${sdk_version}"; exit 1 ;;
          esac

      - name: Lilu Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh) && eval "$src" || exit 1

      - name: Build Debug
        run: xcodebuild -jobs 1 -configuration Debug

      - name: Build Release
        run: xcodebuild -jobs 1 -configuration Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhateverGreen-sequoia
          path: build/*/*.zip

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*/*.zip
          tag: ${{ github.ref }}
          file_glob: true