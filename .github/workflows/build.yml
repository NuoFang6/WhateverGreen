name: Build

on:
  push:
    branches: [ master, 'debug/**' ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  PROJECT_TYPE: KEXT

jobs:
  build:
    name: Build
    # ci-bootstrap.sh pins Xcode 26.6.0, which is the default Xcode on the macos-26 image.
    runs-on: macos-26
    env:
      JOB_TYPE: BUILD
    steps:
      - name: Checkout WhateverGreen
        uses: actions/checkout@v4

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - name: Lilu Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh) && eval "$src" || exit 1

      - name: Build Debug
        run: xcodebuild -jobs 1 -configuration Debug

      - name: Build Release
        run: xcodebuild -jobs 1 -configuration Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhateverGreen
          path: build/*/*.zip

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*/*.zip
          tag: ${{ github.ref }}
          file_glob: true